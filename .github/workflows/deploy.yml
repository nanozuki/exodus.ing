name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-group
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # main only accepts PRs whose required CI checks have passed.
      - name: Build and deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Allow for the app's cold start, then verify the public HTTPS endpoint.
      - name: Check deployed homepage
        run: >-
          curl --fail --silent --show-error --location
          --retry 5 --retry-delay 10 --retry-all-errors --max-time 30
          --output /dev/null https://exodus.ing/
