name: CI

on:
  pull_request:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    # Keep this name stable: main requires this status check before merging.
    name: Checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    env:
      GITHUB_CLIENT_ID: ci-client-id
      GITHUB_CLIENT_SECRET: ci-client-secret
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          gc-max-store-size-linux: 4G

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Install Chromium
        run: nix develop --command pnpm exec playwright install --with-deps chromium

      # Realize PostgreSQL before the test helpers' startup timeout begins.
      - name: Prepare PostgreSQL
        run: nix build --no-link .#pg

      - name: Check formatting
        run: nix develop --command pnpm exec prettier --check .

      - name: Lint
        run: nix develop --command pnpm exec eslint .

      - name: Check application types
        run: nix develop --command pnpm check

      - name: Check end-to-end test types
        run: nix develop --command pnpm check:e2e

      # Includes browser/unit tests, script integration tests, a production build,
      # and end-to-end tests against that build and the flake's PostgreSQL service.
      - name: Run all tests
        run: nix develop --command pnpm test

      - name: Stop PostgreSQL
        if: always()
        run: nix develop --command pnpm pg:stop

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-diagnostics
          path: |
            test-results/
            .direnv/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  deploy:
    name: Deploy app
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
