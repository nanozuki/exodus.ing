name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_CLIENT_ID: ci-client-id
  GITHUB_CLIENT_SECRET: ci-client-secret

# These jobs use separate runners and run in parallel. Keep their names stable:
# main requires each status check before merging; see docs/dependency-updates.md.
jobs:
  check:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project

      - name: Check formatting
        run: nix develop --command pnpm exec prettier --check .

      - name: Lint
        run: nix develop --command pnpm exec eslint .

      - name: Check application types
        run: nix develop --command pnpm check

      - name: Check end-to-end test types
        run: nix develop --command pnpm check:e2e

      - name: Check Docker Node version
        run: nix develop --command node src/scripts/sync-node-version.ts --check

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag exodus-ci .

  test:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project

      # Vitest also supports component tests running in Chromium.
      - name: Install Chromium
        run: nix develop --command pnpm exec playwright install --with-deps chromium

      # Realize PostgreSQL before the test helpers' startup timeout begins.
      - name: Prepare PostgreSQL
        run: nix build --no-link .#pg

      - name: Run unit and repository tests
        run: nix develop --command pnpm test:unit --run

      - name: Run script integration tests
        run: nix develop --command pnpm test:script

      - name: Stop PostgreSQL
        if: always()
        run: nix develop --command pnpm pg:stop

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            test-results/
            .direnv/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

  e2e:
    name: E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project

      - name: Install Chromium
        run: nix develop --command pnpm exec playwright install --with-deps chromium

      - name: Prepare PostgreSQL
        run: nix build --no-link .#pg

      # Global setup builds the production application before starting tests.
      - name: Run end-to-end tests
        run: nix develop --command pnpm test:e2e

      - name: Stop PostgreSQL
        if: always()
        run: nix develop --command pnpm pg:stop

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            test-results/
            .direnv/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
