# fly.toml deploys exodus-ing to fra: port 3000 behind forced HTTPS, machines started on demand and suspended when
# idle with none kept running, each with one shared CPU and 256MB. APP_URL is https://exodus.ing; database and provider
# credentials come from runtime configuration outside this file. GET /healthcheck runs every 10 seconds with a
# 30-second startup grace period and a 5-second timeout.

app = 'exodus-ing'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = '30s'
  interval = '10s'
  method = 'GET'
  timeout = '5s'
  path = '/healthcheck'

[env]
  APP_URL = "https://exodus.ing"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
